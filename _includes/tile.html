{%- assign L = page.lang | default: "en" -%}
{%- assign T = site.data.t[L] -%}
{%- assign p = site.data.products | where: "id", include.id | first -%}
        <a class="tile link{% if p.status == 'live' %} primary{% endif %}" href="{{ p.href[L] }}" style="--n:{{ include.n }}">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 40 40">{{ p.icon }}</svg></span>
          <span class="tag {{ site.data.t.status_class[p.status] }}">{{ T.status[p.status] }}</span>
          <span class="txt"><h3>{{ p.action[L] }} <span class="go" aria-hidden="true">→</span></h3><p>{{ p.short[L] }}</p></span>
        </a>
