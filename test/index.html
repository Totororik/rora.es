<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PDFit — тестовая версия</title>
<style>
  :root { --night: #04060c; --ink: #eef3ff; --soft: #aab6cf; --green: #3dffb4; --teal: #29d3ff; --edge: rgba(255,255,255,.14); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         background: radial-gradient(70% 50% at 20% 0%, rgba(61,255,180,.08), transparent 70%), var(--night);
         color: var(--ink); font: 400 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { width: min(520px, 100%); padding: 32px 28px; border: 1px solid var(--edge); border-radius: 18px;
         background: rgba(255,255,255,.04); }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0 0 18px; color: var(--soft); }
  a.knopka { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: 999px;
             color: #03140e; background: linear-gradient(100deg, var(--green), var(--teal)); font-weight: 700; font-size: 17px;
             text-decoration: none; }
  a.knopka:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  .melko { margin: 16px 0 0; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>PDFit — тестовая версия</h1>
  <p>Здесь новые версии PDFit до выкладки на основной сайт. Что сейчас стоит на тестовой, пишет сессия «Сайт и GitHub».</p>
  <a class="knopka" href="https://aurora-ocr-test.spaincentral.cloudapp.azure.com/?lang=ru">Открыть тестовую версию</a>
  <p class="melko">Если страница не открывается — тестовая машина выключена ради экономии. Основной сайт: <a href="https://pdfit.rora.es/" style="color:var(--teal)">pdfit.rora.es</a>.</p>
</main>
</body>
</html>
